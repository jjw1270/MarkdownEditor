name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
      - name: Repository contracts
        shell: pwsh
        run: ./tests/RepositoryContracts.ps1
      - name: JavaScript syntax
        run: |
          node --check src/web/app.js
          node --check src/web/i18n.js
      - name: Build
        run: dotnet build src/MarkDownEditor.csproj -c Release
      - name: Build update validation harness
        run: dotnet build tests/UpdateValidation/UpdateValidation.csproj -c Release
      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload artifact (exe + web assets; WebView2 Runtime is bundled only in releases)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MarkDownEditor-win-x64
          path: |
            src/bin/Release/net10.0-windows/win-x64/publish/MarkDownEditor.exe
            src/bin/Release/net10.0-windows/win-x64/publish/web/**
