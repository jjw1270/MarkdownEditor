name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302
      - name: Repository contracts
        shell: pwsh
        run: ./tests/RepositoryContracts.ps1
      - name: JavaScript syntax
        run: node --check src/web/app.js
      - name: Build
        run: dotnet build src/MarkDownEditor.csproj -c Release
      - name: Build update validation harness
        run: dotnet build tests/UpdateValidation/UpdateValidation.csproj -c Release
      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload artifact (exe + web assets; WebView2 Runtime is bundled only in releases)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MarkDownEditor-win-x64
          path: |
            src/bin/Release/net10.0-windows/win-x64/publish/MarkDownEditor.exe
            src/bin/Release/net10.0-windows/win-x64/publish/web/**
