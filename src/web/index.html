<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <!-- 렌더된 마크다운 내부의 인라인 스크립트 실행 차단 (보안)
       로컬 이미지는 data URI로 인라인되고, 원격 이미지는 https만 허용 (http는 mixed-content로 어차피 차단) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" />
  <link rel="stylesheet" href="style.css" />
  <title>Markdown</title>
</head>
<body>
  <!-- 타이틀바: 좌측 파일 액션 + 중앙의 [아이콘+타이틀] + (드래그 영역) + 창 제어 -->
  <header id="bar">
    <!-- 파일 가져오기 계열은 좌상단 — 우측 탭 줄에는 현재 문서 액션만 남김 -->
    <button id="openBtn" title="열기 (Ctrl+O)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M1.9 4.1c0-.55.45-1 1-1h3l1.6 1.7h6.6c.55 0 1 .45 1 1v6.1c0 .55-.45 1-1 1H2.9c-.55 0-1-.45-1-1z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="recentBtn" title="최근 문서">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.1" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 4.8V8l2.2 1.5" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <!-- 정중앙 고정 (pointer-events 없음 → 위에서도 창 드래그 가능) -->
    <span id="appTitle"><img id="appIcon" src="appicon.png" alt="" draggable="false" />MarkDownEditor</span>
    <!-- 남은 빈 공간 전체가 창 드래그 영역 -->
    <div class="spacer"></div>

    <!-- 앱 설정(테마·언어)은 타이틀바 우측 — 창 버튼과는 여백으로 구분 -->
    <button id="themeBtn" title="다크 테마">
      <svg class="ic-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M13.1 9.6a5.5 5.5 0 0 1-6.7-6.7 5.7 5.7 0 1 0 6.7 6.7z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <svg class="ic-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="2.7" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 1.9v1.6M8 12.5v1.6M1.9 8h1.6M12.5 8h1.6M3.7 3.7l1.1 1.1M11.2 11.2l1.1 1.1M12.3 3.7l-1.1 1.1M4.8 11.2l-1.1 1.1"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <!-- 언어 선택 메뉴 (하단에 버전 정보 포함) -->
    <button id="langBtn" title="언어">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.1" stroke="currentColor" stroke-width="1.5"/>
        <ellipse cx="8" cy="8" rx="2.7" ry="6.1" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2.2 8h11.6" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>

    <!-- 창 제어 (커스텀 타이틀바) — C#이 네이티브로 처리 -->
    <button id="minBtn" class="winbtn" title="최소화">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3.4 8h9.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="maxBtn" class="winbtn" title="최대화">
      <svg class="ic-max" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="3.7" y="3.7" width="8.6" height="8.6" rx="1.6" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <svg class="ic-restore" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="3.2" y="5.2" width="7.6" height="7.6" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M5.8 3.4h5.4c.9 0 1.6.7 1.6 1.6v5.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="closeBtn" class="winbtn winbtn-close" title="닫기">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <!-- 탭 줄: 내비게이션 + 문서 탭(JS가 생성) + 우측 현재 문서 액션 버튼 -->
  <div id="tabrow">
    <button id="backBtn" title="뒤로 (Alt+←)" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M12.5 8H3.5M7.5 4 3.5 8l4 4" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="fwdBtn" title="앞으로 (Alt+→)" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3.5 8h9M8.5 4l4 4-4 4" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <nav id="tabs"></nav>
    <div class="spacer"></div>
    <button id="toggleBtn" title="편집/미리보기 전환 (Ctrl+E)">
      <svg class="ic-edit" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M9.9 3.2l2.9 2.9-7.2 7.2-3.6 1 1-3.6zM8.8 4.3l2.9 2.9"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="ic-preview" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M1.9 8S4.2 3.9 8 3.9 14.1 8 14.1 8 11.8 12.1 8 12.1 1.9 8 1.9 8z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="8" cy="8" r="1.9" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <button id="saveBtn" title="저장 (Ctrl+S)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2.9 3.9c0-.55.45-1 1-1h7.2l2 2v7.2c0 .55-.45 1-1 1H3.9c-.55 0-1-.45-1-1z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M5.3 3v2.8h4.6V3M4.9 13.1V9.2h6.2v3.9"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="pdfBtn" title="PDF로 내보내기">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M9.1 2.4H4.5c-.55 0-1 .45-1 1v9.2c0 .55.45 1 1 1h7c.55 0 1-.45 1-1V5.8z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M9.1 2.4v3.4h3.4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 7.3v3.2M6.5 9.1 8 10.7l1.5-1.6" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <main>
    <!-- 목차 토글 레일: 탭 바로 아래 왼쪽 고정. 별도 열이라 문서를 가리지 않고 스크롤 영향도 없음 -->
    <div id="tocRail">
      <button id="tocBtn" title="목차 표시/숨김">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <!-- 목차 사이드바 (미리보기 전용, 레일의 ☰ 버튼으로 토글)
         열리면 ☰ 버튼(#tocBtn)이 레일에서 패널 헤더로 이동해 온다 (applyToc) -->
    <aside id="toc" hidden>
      <div id="tocHead">
        <div id="tocTitle">목차</div>
      </div>
      <div id="tocList"></div>
    </aside>
    <!-- tabindex=-1: 클릭 없이도 PageDown/화살표 키 스크롤이 되도록 포커스 가능하게 -->
    <article id="preview" class="markdown-body" tabindex="-1"></article>
    <textarea id="editor" spellcheck="false" hidden></textarea>

    <!-- 찾기 / 바꾸기 바 (편집 모드 전용, Ctrl+F / Ctrl+H) -->
    <div id="findbar" hidden>
      <div class="find-row">
        <button id="findToggle" class="find-toggle" title="바꾸기 펼치기/접기">▸</button>
        <input id="findInput" type="text" placeholder="찾기" spellcheck="false" autocomplete="off" />
        <span id="findCount" class="find-count"></span>
        <button id="findPrev" title="이전 (Shift+Enter)">↑</button>
        <button id="findNext" title="다음 (Enter)">↓</button>
        <button id="findCase" title="대소문자 구분">Aa</button>
        <button id="findClose" title="닫기 (Esc)">✕</button>
      </div>
      <div class="find-row find-replace-row">
        <input id="replaceInput" type="text" placeholder="바꾸기" spellcheck="false" autocomplete="off" />
        <button id="replaceOne" title="현재 항목만 바꾸기">바꾸기</button>
        <button id="replaceAll" title="모두 바꾸기">모두</button>
      </div>
    </div>
  </main>

  <!-- 이미지 클릭 확대 (라이트박스): 클릭·Esc로 닫기 -->
  <div id="lightbox" hidden><img id="lightboxImg" alt="" /></div>

  <!-- 하단 토스트 알림 (PDF 저장·이미지 붙여넣기 등) -->
  <div id="toast"></div>

  <!-- 탭 우클릭 메뉴 (항목은 JS가 생성) -->
  <div id="ctxmenu" role="menu" hidden></div>

  <!-- mermaid.min.js(3.4MB)는 시작 속도를 위해 여기서 로드하지 않고,
       mermaid 블록을 처음 만날 때 app.js가 동적으로 로드한다 (ensureMermaid) -->
  <script src="i18n.js"></script>
  <script src="marked.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
